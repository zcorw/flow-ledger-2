name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm bundle:check

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: ruff check .
        working-directory: backend
      - run: pytest
        working-directory: backend
        env:
          PYTEST_ADDOPTS: "--cov=app --cov-report=term --cov-fail-under=85"
      - run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment scripts
        run: sh -n deploy/compose.sh deploy/deploy.sh deploy/verify.sh
      - name: Validate Caddy deployment mode
        run: >-
          ENV_FILE=deploy/.env.production.example PROXY_MODE=caddy
          sh deploy/compose.sh config --quiet
      - name: Validate external proxy deployment mode
        run: >-
          ENV_FILE=deploy/.env.production.example PROXY_MODE=external
          sh deploy/compose.sh config --quiet
      - name: Require registry images in production
        run: |
          config="$(ENV_FILE=deploy/.env.production.example PROXY_MODE=caddy sh deploy/compose.sh config)"
          if printf '%s\n' "$config" | grep -Eq '^[[:space:]]+build:'; then
            echo "production Compose must not build images on the VPS" >&2
            exit 1
          fi
          printf '%s\n' "$config" | grep -q 'ghcr.io/zcorw/flow-ledger-backend:latest'
          printf '%s\n' "$config" | grep -q 'ghcr.io/zcorw/flow-ledger-frontend:latest'
      - name: Reject an invalid proxy mode
        run: >-
          ! ENV_FILE=deploy/.env.production.example PROXY_MODE=invalid
          sh deploy/compose.sh config --quiet

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  images:
    name: Publish ${{ matrix.name }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend, deployment, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: ghcr.io/zcorw/flow-ledger-backend
            cache_scope: backend
          - name: frontend
            context: .
            dockerfile: ./frontend/Dockerfile
            image: ghcr.io/zcorw/flow-ledger-frontend
            cache_scope: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
