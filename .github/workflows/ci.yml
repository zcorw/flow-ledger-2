name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm bundle:check

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: ruff check .
        working-directory: backend
      - run: pytest
        working-directory: backend
        env:
          PYTEST_ADDOPTS: "--cov=app --cov-report=term --cov-fail-under=85"
      - run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment scripts
        run: sh -n deploy/compose.sh deploy/deploy.sh deploy/verify.sh
      - name: Validate Caddy deployment mode
        run: >-
          ENV_FILE=deploy/.env.production.example PROXY_MODE=caddy
          sh deploy/compose.sh config --quiet
      - name: Validate external proxy deployment mode
        run: >-
          ENV_FILE=deploy/.env.production.example PROXY_MODE=external
          sh deploy/compose.sh config --quiet
      - name: Reject an invalid proxy mode
        run: >-
          ! ENV_FILE=deploy/.env.production.example PROXY_MODE=invalid
          sh deploy/compose.sh config --quiet

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
