name: flow-ledger2

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flow_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-flow_ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flow_ledger}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flow_ledger} -d ${POSTGRES_DB:-flow_ledger}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://flow_ledger:flow_ledger@postgres:5432/flow_ledger}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  scheduler:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://flow_ledger:flow_ledger@postgres:5432/flow_ledger}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.scheduler"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:
